<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Actualizando</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Outfit", "Segoe UI", -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 30%, #2d2650 0%, #1e1b2e 65%);
    color: #ece9ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    user-select: none;
    -webkit-app-region: drag;
    overflow: hidden;
  }
  .logo-wrap { position: relative; width: 112px; height: 112px; display: grid; place-items: center; }
  .halo {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(124, 108, 255, .45), transparent 70%);
    animation: halo 2.2s ease-in-out infinite;
  }
  .logo {
    position: relative; width: 88px; height: 88px; object-fit: contain;
    animation: flotar 2.2s ease-in-out infinite;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.35));
  }
  .texto { text-align: center; min-height: 52px; padding: 0 28px; }
  .titulo { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .sub { margin-top: 6px; font-size: 12.5px; color: #a8a2cc; }
  .barra {
    width: 200px; height: 6px; border-radius: 99px;
    background: rgba(255,255,255,.1); overflow: hidden;
    opacity: 0; transition: opacity .25s;
  }
  .barra.visible { opacity: 1; }
  .relleno {
    height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, #7c6cff, #a78bfa);
    transition: width .3s ease;
  }
  .barra.indeterminada .relleno { width: 35%; animation: ir-venir 1.2s ease-in-out infinite; }
  @keyframes flotar { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.04); } }
  @keyframes halo { 0%,100% { transform: scale(.85); opacity: .6; } 50% { transform: scale(1.1); opacity: 1; } }
  @keyframes ir-venir { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
  @media (prefers-reduced-motion: reduce) {
    .logo, .halo, .barra.indeterminada .relleno { animation: none; }
  }
</style>
</head>
<body>
  <div class="logo-wrap">
    <div class="halo"></div>
    <img class="logo" src="../dist/images/logo-tezains.png" alt="">
  </div>
  <div class="texto">
    <div class="titulo" id="titulo">Buscando actualizaciones…</div>
    <div class="sub" id="sub">Esto solo toma un momento</div>
  </div>
  <div class="barra visible indeterminada" id="barra"><div class="relleno" id="relleno"></div></div>

<script>
  const titulo = document.getElementById('titulo');
  const sub = document.getElementById('sub');
  const barra = document.getElementById('barra');
  const relleno = document.getElementById('relleno');
  let version = null;

  function barraIndeterminada() {
    barra.className = 'barra visible indeterminada';
    relleno.style.width = '';
  }

  window.splash.alCambiarEstado((e) => {
    if (e.version) version = e.version;
    if (e.fase === 'buscando') {
      titulo.textContent = 'Buscando actualizaciones…';
      sub.textContent = 'Esto solo toma un momento';
      barraIndeterminada();
    } else if (e.fase === 'descargando') {
      titulo.textContent = 'Descargando actualización';
      sub.textContent = (version ? 'Versión ' + version + ' · ' : '') + e.porcentaje + '%';
      barra.className = 'barra visible';
      relleno.style.width = e.porcentaje + '%';
    } else if (e.fase === 'instalando') {
      titulo.textContent = 'Instalando actualización…';
      sub.textContent = 'La app se cerrará y se volverá a abrir sola';
      barraIndeterminada();
    } else if (e.fase === 'mensaje') {
      titulo.textContent = e.texto;
      sub.textContent = 'Regresando a la app…';
      barra.className = 'barra';
    }
  });
</script>
</body>
</html>
